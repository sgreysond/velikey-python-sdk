name: Publish Python SDK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish"
        required: true
        default: "0.1.0"

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Type check (best effort)
        continue-on-error: true
        run: |
          if python -c "import mypy" 2>/dev/null; then
            mypy src/velikey || true
          else
            echo "mypy not installed; skipping"
          fi

      - name: Lint (best effort)
        continue-on-error: true
        run: |
          pip install ruff || true
          ruff check src tests || true

  publish:
    needs: test
    runs-on: ubuntu-latest
    # Only attempt the actual PyPI upload on a `release: published`
    # event. workflow_dispatch invocations produce the dist artifact
    # for inspection but skip the upload step - PyPI Trusted Publishing
    # is keyed on the workflow ref, and we don't currently have a
    # 'workflow_dispatch' trusted publisher configured (the original
    # `release: published` config is the only one we own). Manual
    # dispatch was failing every run with "no Trusted Publisher
    # configuration matched" since the v0.1.0 release on 2026-03-01.
    if: github.event_name == 'release'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Upload dist as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-dist
          path: dist/
          retention-days: 30
